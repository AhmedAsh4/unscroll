name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix desktop
      - run: npm run check --prefix desktop
      - run: npm run build --prefix desktop
      # Stage the pinned, checksummed ADB runtime that tauri.conf.json
      # bundles via resources/adb/*. Fresh checkouts do not carry the
      # git-ignored binaries; without this the tauri build script fails
      # on the unmatched resources glob.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-adb.ps1
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: node --test "desktop/src/tests/*.test.ts" "desktop/src/tests/scenarios/*.test.ts"
      - run: git diff --exit-code -- desktop/package-lock.json desktop/src-tauri/Cargo.lock launcher/settings-gradle.lockfile launcher/app/gradle.lockfile

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # NOTE: android-actions/setup-android@v3 is intentionally not used:
      # it unconditionally installs the obsolete `tools` package, which no
      # longer exists in current cmdline-tools (sdkmanager exits 1 with
      # "Failed to find package 'tools'"). ubuntu runners preinstall the
      # SDK but do not put sdkmanager on PATH, so it is invoked by full
      # path under $ANDROID_HOME.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x launcher/gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: launcher
      - run: test -f LICENSE && test -f THIRD_PARTY_NOTICES.md && test -f launcher/LICENSE && test -f launcher/UPSTREAM.md
      - run: git diff --exit-code -- desktop/package-lock.json desktop/src-tauri/Cargo.lock launcher/settings-gradle.lockfile launcher/app/gradle.lockfile

  # Task 20 emulator matrix: exactly API 24, 28, 29, 33, 36. Each leg runs
  # launcher/emulator/run-matrix.sh (unit gate + managed-device instrumented
  # gate for its API). fail-fast keeps failures blocking. Store, bridge,
  # reconciliation, and HOME failures are hard failures, never flaky; the
  # only permitted retry is one manual re-run of a leg that failed on
  # documented emulator-boot/harness infra with no test assertion recorded.
  android-emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api-level: [24, 28, 29, 33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Same note as the android job: setup-android@v3 is broken
      # (obsolete `tools` package), so sdkmanager is used by full path.
      # Gradle Managed Devices auto-provisions the emulator system
      # image for the matrix API level at task time.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - run: chmod +x launcher/gradlew launcher/emulator/run-matrix.sh
      - run: launcher/emulator/run-matrix.sh ${{ matrix.api-level }}
