// Task 20 emulator matrix: Gradle managed-device definitions for the exact
// V1 API matrix (24, 28, 29, 33, 36). New file only: it is injected into
// `:app` by the sibling `init-managed-devices.gradle` init script (used via
// `gradlew -I`), so no build file or app logic is touched. Each device runs the same four Android gates on its API level:
// allowlist filtering, bridge DUMP security (shell-allowed / app-denied),
// recovery schema accept/reject, and HOME intent handling (see
// `api-test-filter.md` next to this file).
//
// The init script provides `managedVirtualDeviceType` (loaded from `:app`'s
// buildscript classpath, since the AGP DSL type is not visible to init
// scripts as a class literal); device entries below must use that variable.
//
// Usage (also invoked per level by `run-matrix.sh`, which additionally
// runs `:app:testDebugUnitTest` first in the same invocation):
//   ./gradlew --no-daemon -I emulator/init-managed-devices.gradle -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true pixel24DebugAndroidTest
//   ./gradlew --no-daemon -I emulator/init-managed-devices.gradle -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true pixel28DebugAndroidTest
//   ./gradlew --no-daemon -I emulator/init-managed-devices.gradle -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true pixel29DebugAndroidTest
//   ./gradlew --no-daemon -I emulator/init-managed-devices.gradle -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true pixel33DebugAndroidTest
//   ./gradlew --no-daemon -I emulator/init-managed-devices.gradle -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true pixel36DebugAndroidTest
// The experimental flag is required on every invocation (not just API 24:
// pixel24 is created at configuration time for all of them).
android {
    testOptions {
        managedDevices {
            devices {
                // API 24 (Android 7.0): minimum supported. No AOSP image is
                // published for this level, so the Google APIs image is used.
                // API 24 also needs Gradle's opt-in for pre-26 managed
                // devices (see run-matrix.sh); it exercises the same gates.
                pixel24(managedVirtualDeviceType) {
                    device = "Pixel 6"
                    apiLevel = 24
                    systemImageSource = "google"
                }
                // API 28 (Android 9): pre-scoped-storage behavior baseline.
                // No AOSP image is published for this level either.
                pixel28(managedVirtualDeviceType) {
                    device = "Pixel 6"
                    apiLevel = 28
                    systemImageSource = "google"
                }
                // API 29 (Android 10): scoped storage + fully gestural nav.
                // Google APIs image here as well (no AOSP image published).
                pixel29(managedVirtualDeviceType) {
                    device = "Pixel 6"
                    apiLevel = 29
                    systemImageSource = "google"
                }
                // API 33 (Android 13): runtime notification permission.
                pixel33(managedVirtualDeviceType) {
                    device = "Pixel 6"
                    apiLevel = 33
                    systemImageSource = "aosp-atd"
                }
                // API 36 (Android 16): current target/compile SDK.
                pixel36(managedVirtualDeviceType) {
                    device = "Pixel 6"
                    apiLevel = 36
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
}

